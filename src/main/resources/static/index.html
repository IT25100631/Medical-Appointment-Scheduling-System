<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Appointment System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f8fb;
        }

        .page-title {
            font-weight: bold;
            color: #0d6efd;
        }

        .card {
            border-radius: 15px;
        }

        #result {
            font-weight: bold;
            margin-top: 15px;
        }

        .appointment-card {
            background: #ffffff;
            border-left: 5px solid #0d6efd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-4 page-title">Medical Appointment Management</h1>

    <!-- Booking Section -->
    <div class="card shadow p-4 mb-4">
        <h2 class="mb-3">Book Appointment</h2>

        <form id="appointmentForm">
            <div class="mb-3">
                <input type="text" id="id" class="form-control" placeholder="Appointment ID" required>
            </div>

            <div class="mb-3">
                <input type="text" id="patientId" class="form-control" placeholder="Patient ID" required>
            </div>

            <div class="mb-3">
                <input type="text" id="patientName" class="form-control" placeholder="Patient Name" required>
            </div>

            <div class="mb-3">
                <input type="text" id="doctorId" class="form-control" placeholder="Doctor ID" required>
            </div>

            <div class="mb-3">
                <input type="text" id="doctorName" class="form-control" placeholder="Doctor Name" required>
            </div>

            <div class="mb-3">
                <input type="datetime-local" id="startTime" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="text" id="reason" class="form-control" placeholder="Reason" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Book Appointment</button>
        </form>
    </div>

    <!-- Cancel Section -->
    <div class="card shadow p-4 mb-4">
        <h2 class="mb-3">Cancel Appointment</h2>

        <div class="row g-2">
            <div class="col-md-8">
                <input type="text" id="cancelId" class="form-control" placeholder="Enter Appointment ID to Cancel">
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-danger w-100" onclick="cancelAppointment()">Cancel Appointment</button>
            </div>
        </div>
    </div>

    <!-- View Section -->
    <div class="card shadow p-4 mb-4">
        <h2 class="mb-3">View All Appointments</h2>
        <button type="button" class="btn btn-success w-100" onclick="viewAppointments()">View All Appointments</button>
    </div>

    <!-- Result -->
    <div id="result" class="text-success mb-3"></div>

    <!-- Appointment List -->
    <div id="appointmentList"></div>
</div>

<script>
    document.getElementById("appointmentForm")
        .addEventListener("submit", async function (e) {
            e.preventDefault();

            const appointment = {
                id: document.getElementById("id").value,
                patientId: document.getElementById("patientId").value,
                patientName: document.getElementById("patientName").value,
                doctorId: document.getElementById("doctorId").value,
                doctorName: document.getElementById("doctorName").value,
                startTime: document.getElementById("startTime").value + ":00",
                reason: document.getElementById("reason").value
            };

            try {
                const response = await fetch("http://localhost:8080/appointments", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(appointment)
                });

                const result = await response.text();
                document.getElementById("result").innerText = result;

            } catch (error) {
                document.getElementById("result").innerText = "Error: " + error.message;
            }
        });

    async function cancelAppointment() {
        const id = document.getElementById("cancelId").value;

        if (!id) {
            document.getElementById("result").innerText = "Please enter Appointment ID";
            return;
        }

        try {
            const response = await fetch(`http://localhost:8080/appointments/${id}/cancel`, {
                method: "PUT"
            });

            const result = await response.text();
            document.getElementById("result").innerText = result;

        } catch (error) {
            document.getElementById("result").innerText = "Error: " + error.message;
        }
    }

    async function viewAppointments() {
        try {
            const response = await fetch("http://localhost:8080/appointments");
            const appointments = await response.json();

            let output = "<h3 class='mb-3'>All Appointments</h3>";

            if (appointments.length === 0) {
                output += "<div class='alert alert-warning'>No appointments found</div>";
            } else {
                appointments.forEach(a => {
                    output += `
                        <div class="appointment-card">
                            <p><strong>ID:</strong> ${a.id}</p>
                            <p><strong>Patient:</strong> ${a.patientName}</p>
                            <p><strong>Doctor:</strong> ${a.doctorName}</p>
                            <p><strong>Status:</strong> ${a.status}</p>
                            <p><strong>Reason:</strong> ${a.reason}</p>
                        </div>
                    `;
                });
            }

            document.getElementById("appointmentList").innerHTML = output;

        } catch (error) {
            document.getElementById("appointmentList").innerHTML = "Error: " + error.message;
        }
    }
</script>

</body>
</html>
